name: Validate manifest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # TODO: replace with the WMKeyboard commit that ships wm-python-cli
  # (native/wm-python-cli), before the first push of the Python plugins.
  WM_PYTHON_REV: REPLACE_WITH_WMKEYBOARD_SHA

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jsonschema

      # Plugin tests run on wm-python, the interpreter the keyboard ships (a
      # Rust port of PyMini), through its command-line runner. Pin the rev to
      # the WMKeyboard commit whose wm-python matches the app being released.
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: wm-python-cli-${{ env.WM_PYTHON_REV }}

      - name: Install wm-python-cli
        run: |
          command -v wm-python-cli || cargo install \
            --git https://github.com/wasi-master/WMKeyboard --rev "$WM_PYTHON_REV" wm-python-cli

      # Schema pass, plus the things a schema can't express: every path,
      # preview and icon resolves to a file that is actually in the repo, ids
      # are unique, and any checksum present is correct.
      - name: Validate wmkeyboard-repo.json
        run: python3 tools/validate.py

      # sha256/sizeBytes are optional, but a stale one is worse than a missing
      # one — the app would refuse an install that is actually fine.
      - name: Check checksums are current
        run: python3 tools/build_index.py --check

      # The archives people install must be built from the sources people read.
      - name: Check plugin archives are current
        run: python3 tools/build_plugins.py --check

      # Every plugin is linted for Python PyMini lacks and smoke-rendered
      # against the widget caps; every test.py runs on wm-python-cli.
      - name: Run plugin tests
        run: python3 tools/test_plugins.py --require-cli
