name: Validate manifest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The WMKeyboard commit whose wm-python the plugin tests run on, through
  # wmpy (native/wmpy). Move it forward with the app, so the tests run on
  # the interpreter people have. It must be a commit that has native/wmpy:
  # an older one only has the runner's old name, wm-python-cli.
  WM_PYTHON_REV: 9c11c5fc61ce9fd397b005a88976d773cd65f98e

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jsonschema

      # Plugin tests run on wm-python, the interpreter the keyboard ships (a
      # Rust port of PyMini), through wmpy, its command-line tool. Pin the rev
      # to the WMKeyboard commit whose wm-python matches the app being released.
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: wmpy-${{ env.WM_PYTHON_REV }}

      - name: Install wmpy
        run: |
          command -v wmpy || cargo install \
            --git https://github.com/wasi-master/WMKeyboard --rev "$WM_PYTHON_REV" wmpy

      # Schema pass, plus the things a schema can't express: every path,
      # preview and icon resolves to a file that is actually in the repo, ids
      # are unique, and any checksum present is correct.
      - name: Validate wmkeyboard-repo.json
        run: python3 tools/validate.py

      # sha256/sizeBytes are optional, but a stale one is worse than a missing
      # one — the app would refuse an install that is actually fine.
      - name: Check checksums are current
        run: python3 tools/build_index.py --check

      # The archives people install must be built from the sources people read.
      - name: Check plugin archives are current
        run: python3 tools/build_plugins.py --check

      # Every plugin is linted for Python PyMini lacks and smoke-rendered
      # against the widget caps; every test.py and tests/test_*.py runs
      # under wmpy test.
      - name: Run plugin tests
        run: python3 tools/test_plugins.py --require-cli
