# README.md is generated from wmkeyboard-repo.json by tools/gen_readme.py.
# Rebuilt here on every push that can change it, so nobody has to remember.
# A push made with GITHUB_TOKEN starts no workflow, so this cannot loop, and
# update-emoji-fonts.yml regenerates the README itself for the same reason.
name: README

on:
  push:
    branches: [main]
    paths:
      - wmkeyboard-repo.json
      - tools/gen_readme.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate README.md
        run: python3 tools/gen_readme.py

      - name: Commit if it changed
        run: |
          if git diff --quiet README.md; then
            echo "README.md is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "docs(readme): regenerate from wmkeyboard-repo.json" README.md
          git pull -q --rebase
          git push
